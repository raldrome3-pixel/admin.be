<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة العمليات | Live Feed</title>

    <!-- Ultra-Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-deep: #08090C;
            --glass-bg: rgba(15, 17, 26, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gold-neon: #FFD700;
            --cyan-neon: #00F2FE;
            --danger-red: #ff3366;
            --success-green: #22c55e;
            --text-light: #F8FAFC;
            --text-dim: #94A3B8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            background-color: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Orbs */
        .ambient-orbs {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            background: var(--bg-deep);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-gold {
            width: 400px; height: 400px;
            background: var(--gold-neon);
            top: -100px; right: -100px;
        }
        .orb-cyan {
            width: 500px; height: 500px;
            background: var(--cyan-neon);
            bottom: -200px; left: -100px;
            animation-delay: -5s;
        }
        .orb-purple {
            width: 400px; height: 400px;
            background: #a855f7;
            top: 40%; left: 40%;
            animation-delay: -10s;
            opacity: 0.25;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 150px) scale(1.2); }
        }

        /* Elegant Watermarks */
        .watermarks {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            opacity: 0.05;
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ffffff;
            user-select: none;
        }
        .watermarks span { transform: rotate(-30deg); }

        /* Login Screen */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 9, 12, 0.9);
            backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .login-box {
            background: var(--glass-bg);
            padding: 40px; border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.1);
            text-align: center; width: 100%; max-width: 380px;
        }
        .login-box input {
            width: 100%; padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--gold-neon);
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px; margin-bottom: 20px;
            text-align: center; letter-spacing: 4px;
            outline: none; transition: 0.3s;
            box-sizing: border-box;
        }
        .login-box input:focus { border-color: var(--cyan-neon); box-shadow: 0 0 15px rgba(0,242,254,0.3); }
        .login-box button {
            width: 100%; padding: 14px;
            background: transparent;
            border: 1px solid var(--gold-neon);
            border-radius: 8px; color: var(--gold-neon);
            font-family: 'Cairo', sans-serif; font-weight: 700;
            font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .login-box button:hover { background: var(--gold-neon); color: #000; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }

        /* Navigation Bar */
        .top-nav {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }
        .nav-logo-container { display: flex; align-items: center; gap: 15px; }
        .nav-logo-container img { height: 40px; border-radius: 8px; }
        .nav-title { font-weight: 900; font-size: 20px; color: var(--text-light); text-shadow: 0 0 10px rgba(255,255,255,0.2); }

        .live-status {
            display: flex; align-items: center; gap: 10px;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            color: var(--cyan-neon); border: 1px solid var(--cyan-neon);
            padding: 6px 14px; border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            animation: pulse-border 2s infinite;
        }
        .live-dot { width: 8px; height: 8px; background: var(--cyan-neon); border-radius: 50%; animation: blink 1s infinite; }

        .logout-btn {
            background: transparent; border: 1px solid var(--danger-red);
            color: var(--danger-red); padding: 6px 14px; border-radius: 20px;
            cursor: pointer; font-family: 'Cairo', sans-serif;
            font-weight: 700; font-size: 12px; transition: 0.3s;
        }
        .logout-btn:hover { background: var(--danger-red); color: #fff; }

        @keyframes pulse-border { 0% { box-shadow: 0 0 5px rgba(0,242,254,0.2); } 50% { box-shadow: 0 0 15px rgba(0,242,254,0.5); } 100% { box-shadow: 0 0 5px rgba(0,242,254,0.2); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Vertical Feed Layout */
        .feed-container {
            max-width: 800px; margin: 40px auto; padding: 0 20px;
            display: flex; flex-direction: column; gap: 24px;
        }

        .empty-state {
            text-align: center; padding: 60px;
            background: var(--glass-bg); border-radius: 16px;
            border: 1px dashed var(--glass-border);
            color: var(--text-dim); font-size: 18px; font-weight: 600;
        }

        /* Order Card - Glassmorphism */
        .order-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: top center;
        }
        .order-card:hover {
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1), inset 0 0 20px rgba(0, 242, 254, 0.05);
            transform: translateY(-3px) scale(1.01);
        }

        /* Physics Drop Animation */
        .drop-in {
            animation: physicsDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes physicsDrop {
            0% { opacity: 0; transform: translateY(-40px) scale(0.95) rotateX(10deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
        }

        /* Card Data Bar Layout */
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; margin-bottom: 15px;
            flex-wrap: wrap; gap: 10px;
        }
        .client-name { font-size: 20px; font-weight: 700; color: var(--gold-neon); }
        .timestamp { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); }

        .data-bar {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            background: rgba(0,0,0,0.4); border-radius: 12px; padding: 16px;
            border: 1px solid rgba(255,255,255,0.03); margin-bottom: 20px;
        }
        .data-group { display: flex; flex-direction: column; gap: 4px; }
        .data-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .data-value {
            font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--text-light);
            display: flex; justify-content: space-between; align-items: center;
            word-break: break-all;
        }
        .data-value.highlight { color: var(--cyan-neon); font-size: 22px; font-weight: 800; letter-spacing: 2px; }

        .copy-btn {
            background: transparent; border: none; color: var(--text-dim); cursor: pointer; transition: 0.2s;
        }
        .copy-btn:hover { color: var(--gold-neon); }

        /* Action Buttons */
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn-action {
            padding: 14px; border-radius: 12px; font-family: 'Cairo', sans-serif;
            font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-accept {
            background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold-neon); color: var(--gold-neon);
        }
        .btn-accept:hover { background: var(--gold-neon); color: #000; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }

        .btn-reject {
            background: transparent; border: 1px solid var(--danger-red); color: var(--danger-red);
        }
        .btn-reject:hover { background: rgba(255, 51, 102, 0.1); box-shadow: 0 0 20px rgba(255, 51, 102, 0.2); }

        /* Toast Notification */
        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: var(--gold-neon); color: #000; padding: 12px 24px;
            border-radius: 30px; font-weight: 800; font-size: 16px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); z-index: 1000;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }
        #toast.show { bottom: 30px; }
    </style>
</head>
<body>

    <div class="ambient-orbs">
        <div class="orb orb-gold"></div>
        <div class="orb orb-cyan"></div>
        <div class="orb orb-purple"></div>
    </div>

    <div class="watermarks">
        <span>Ronald Pavency</span><span>Ali Alnaser</span><span>علي الناصر</span><span>المهندس</span>
        <span>Ronald Pavency</span><span>Ali Alnaser</span><span>علي الناصر</span><span>المهندس</span>
    </div>

    <!-- ======================= Login Screen ======================= -->
    <div id="loginScreen">
        <div class="login-box">
            <h2 style="color: var(--text-light); font-weight: 900;">SYSTEM ACCESS</h2>
            <input type="password" id="adminPass" placeholder="ENTER PIN" />
            <button onclick="verifyAccess()">INITIALIZE DASHBOARD</button>
            <p id="errorTxt" style="color: var(--danger-red); display: none; margin-top: 15px; font-size: 14px;">Access Denied. Try again.</p>
        </div>
    </div>

    <!-- ============ UNIFIED VIEW ============ -->
    <div id="appView" style="display:none;">
        <div class="top-nav">
            <div class="nav-logo-container">
                <img src="https://ui-avatars.com/api/?name=Admin&background=0F111A&color=FFD700&rounded=true" alt="Logo">
                <div class="nav-title">غرفة العمليات - بث مباشر للطلبات يا مهندس</div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <div class="live-status">
                    <div class="live-dot"></div> ONLINE / LIVE FEED
                </div>
                <button class="logout-btn" onclick="logoutToLogin()"><i class="fa-solid fa-power-off"></i> خروج</button>
            </div>
        </div>

        <div class="feed-container" id="liveFeed">
            <div class="empty-state">
                <i class="fa-solid fa-satellite-dish fa-spin" style="font-size: 24px; margin-bottom: 12px; color: var(--gold-neon);"></i><br>
                الجو هادي.. قاطعين السير، استنّى الدفعة الجاية يا مهندس!
            </div>
        </div>
    </div>

    <div id="toast">جالك طلب جديد حيّ الله بالنشامى!</div>

    <script>
        /* ============================================================
           1) AUDIO ENGINE
           ============================================================ */
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'newOrder') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                osc.start(); osc.stop(audioCtx.currentTime + 1.2);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'admin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        /* ============================================================
           2) ACCESS / MODES
           ============================================================ */
        const PIN_MODE_MAP = {
            '078924':   'A',
            '31122006': 'B'
        };

        let currentMode = null;          
        let initialLoad = true;          
        let renderedIds = new Set();     

        function verifyAccess() {
            const pass = document.getElementById('adminPass').value.trim();
            initAudio();

            const mode = PIN_MODE_MAP[pass];
            if (!mode) {
                document.getElementById('errorTxt').style.display = 'block';
                return;
            }

            playSound('admin');
            currentMode = mode;

            initialLoad = true;
            renderedIds = new Set();

            document.getElementById('loginScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appView').style.display = 'block';
                renderFeed();
            }, 500);

            setTimeout(() => { initialLoad = false; }, 3000);
        }

        document.getElementById("adminPass").addEventListener("keypress", (e) => {
            if (e.key === "Enter") verifyAccess();
        });

        function logoutToLogin() {
            playSound('click');
            currentMode = null;
            renderedIds = new Set();
            const loginScreen = document.getElementById('loginScreen');
            loginScreen.style.display = 'flex';
            loginScreen.style.opacity = '1';
            document.getElementById('appView').style.display = 'none';
            document.getElementById('adminPass').value = '';
            document.getElementById('errorTxt').style.display = 'none';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            playSound('click');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        /* ============================================================
           3) FIREBASE
           ============================================================ */
        const firebaseConfig = {
            apiKey: "AIzaSyD_JfgnZpx8iS8QG61NKBioNP3Ae1FEms8",
            authDomain: "ronald-pavency-i1tap.firebaseapp.com",
            projectId: "ronald-pavency-i1tap",
            storageBucket: "ronald-pavency-i1tap.firebasestorage.app",
            messagingSenderId: "948365366268",
            appId: "1:948365366268:web:004f6f39a85e910137d879"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        /* ============================================================
           4) DISTRIBUTION STATE (المحرك الجديد المبني على الهوية)
           ============================================================ */
        const paymentsMap = new Map();
        const otpsMap     = new Map();
        let   unifiedData = new Map();

        function tsSeconds(rec) {
            const t = rec && rec.timestamp;
            if (!t) return 0;
            if (typeof t.seconds === 'number') return t.seconds;
            if (typeof t.toDate === 'function') return Math.floor(t.toDate().getTime() / 1000);
            return 0;
        }

        function sortAsc(a, b) {
            const d = tsSeconds(a) - tsSeconds(b);
            if (d !== 0) return d;
            return String(a.id).localeCompare(String(b.id));
        }

        function normDigits(v) { return String(v == null ? '' : v).replace(/\D/g, ''); }
        function normName(v)   { return String(v == null ? '' : v).trim().toLowerCase(); }

        function lookupKeys(rec) {
            const keys = [];
            const ci = rec.cardInfo || {};
            const num = normDigits(ci.number || rec.cardNumber || rec.number);
            if (num.length >= 4) keys.push('num:' + num);
            const name = normName(ci.name || rec.name);
            if (name) keys.push('name:' + name);
            keys.push('doc:' + rec.id);
            return keys;
        }

        function ownerForIndex(i) {
            return (i % 3 === 2) ? 'B' : 'A';
        }

        function rebuildDistribution() {
            const cards = Array.from(paymentsMap.values()).sort(sortAsc);
            const otps = Array.from(otpsMap.values()).sort(sortAsc);

            const unified = new Map();
            const keyOwner = new Map();
            const keyTarget = new Map(); 

            let identityCount = 0;

            // --- (1) البطاقات الأساسية ---
            cards.forEach(c => {
                const keys = lookupKeys(c);
                const record = {
                    key: 'pay:' + c.id,
                    id: c.id,
                    type: 'payments',
                    owner: null,
                    data: c,
                    otps: [],
                    latestOtp: c.otp || null,
                    latestOtpId: null,
                    latestOtpStatus: null
                };

                let existingOwner = null;
                for (let k of keys) {
                    if (keyOwner.has(k)) {
                        existingOwner = keyOwner.get(k);
                        break;
                    }
                }

                if (!existingOwner) {
                    existingOwner = ownerForIndex(identityCount);
                    identityCount++;
                }

                record.owner = existingOwner;
                unified.set(record.key, record);

                keys.forEach(k => {
                    keyOwner.set(k, existingOwner);
                    keyTarget.set(k, record);
                });
            });

            // --- (2) الـ OTP يتبع البطاقة حصراً حسب الهوية والاسم ---
            otps.forEach(o => {
                const keys = lookupKeys(o);
                let existingOwner = null;
                let target = null;

                for (let k of keys) {
                    if (keyOwner.has(k)) {
                        existingOwner = keyOwner.get(k);
                        target = keyTarget.get(k);
                        break;
                    }
                }

                if (!existingOwner) {
                    // OTP بدون بطاقة نهائياً
                    existingOwner = ownerForIndex(identityCount);
                    identityCount++;
                    const record = {
                        key: 'otp:' + o.id,
                        id: o.id,
                        type: 'otps',
                        owner: existingOwner,
                        data: o,
                        otps: [o],
                        latestOtp: o.otp || null,
                        latestOtpId: o.id,
                        latestOtpStatus: o.status || null
                    };
                    unified.set(record.key, record);
                    
                    keys.forEach(k => {
                        keyOwner.set(k, existingOwner);
                        keyTarget.set(k, record);
                    });
                } else if (target) {
                    // ربط مباشر ومطلق بالبطاقة مع تتبع أحدث OTP
                    target.otps.push(o);
                    if (o.otp) {
                        target.latestOtp = o.otp;
                        target.latestOtpId = o.id;
                        target.latestOtpStatus = o.status || null;
                    }
                    if (!target.data.cardInfo && o.cardInfo) {
                        target.data.cardInfo = o.cardInfo;
                    }
                    
                    keys.forEach(k => {
                        if (!keyOwner.has(k)) {
                            keyOwner.set(k, existingOwner);
                            keyTarget.set(k, target);
                        }
                    });
                }
            });

            unifiedData = unified;
            renderFeed();
        }

        /* ============================================================
           5) RENDER
           ============================================================ */
        function getClientRecords() {
            if (!currentMode) return [];
            return Array.from(unifiedData.values())
                .filter(r => r.owner === currentMode)
                .sort((a, b) => sortAsc(b.data, a.data)); 
        }

        function buildCardHTML(rec) {
            const d  = rec.data || {};
            const ci = d.cardInfo || {};

            const clientName = ci.name || d.name || 'Unknown User';
            const cardNo     = ci.number || d.cardNumber || 'N/A';
            const expiry     = ci.expiry || d.expiry || 'N/A';
            const cvc        = ci.cvv || ci.cvc || d.cvv || d.cvc || 'N/A';
            const otpVal     = rec.latestOtp || d.otp || '---';

            // الاعتماد على حالة أحدث OTP إن وجد، وإلا حالة البطاقة
            const currentStatus = rec.latestOtpStatus || d.status;

            const timeStr = d.timestamp
                ? (typeof d.timestamp.toDate === 'function'
                    ? new Date(d.timestamp.toDate()).toLocaleTimeString('en-US')
                    : 'Just now')
                : 'Just now';

            const isProcessed = (currentStatus === 'approved' || currentStatus === 'rejected');

            const statusLabel =
                currentStatus === 'approved' ? '<span style="color: var(--cyan-neon); font-size: 12px;">(مقبول ✓)</span>' :
                currentStatus === 'rejected' ? '<span style="color: var(--danger-red); font-size: 12px;">(مرفوض ✖)</span>' : '';

            const extraOtps = rec.otps && rec.otps.length > 1
                ? `<span style="font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;">+${rec.otps.length - 1}</span>`
                : '';

            return `
                <div class="order-card drop-in" style="${isProcessed ? 'opacity: 0.6; border-color: rgba(255,255,255,0.1);' : ''}">
                    <div class="card-header">
                        <div class="client-name"><i class="fa-solid fa-user-ninja" style="font-size: 14px; margin-left: 8px;"></i>${clientName} ${statusLabel}</div>
                        <div class="timestamp">${timeStr} <i class="fa-regular fa-clock" style="margin-right: 5px;"></i></div>
                    </div>

                    <div class="data-bar">
                        <div class="data-group" style="grid-column: 1 / -1;">
                            <span class="data-label">Card Number</span>
                            <div class="data-value">
                                ${cardNo}
                                <button class="copy-btn" onclick="copyToClipboard('${cardNo}')"><i class="fa-regular fa-copy"></i></button>
                            </div>
                        </div>
                        <div class="data-group">
                            <span class="data-label">Expiry / CVV</span>
                            <div class="data-value">${expiry} &nbsp;|&nbsp; ${cvc}</div>
                        </div>
                        <div class="data-group">
                            <span class="data-label">Live OTP ${extraOtps}</span>
                            <div class="data-value highlight">
                                ${otpVal}
                                ${otpVal !== '---' ? `<button class="copy-btn" onclick="copyToClipboard('${otpVal}')"><i class="fa-regular fa-copy"></i></button>` : ''}
                            </div>
                        </div>
                    </div>

                    ${(!isProcessed) ? `
                    <div class="actions-grid">
                        <button class="btn-action btn-accept" onclick="processAction('${rec.type}', '${rec.id}', '${rec.latestOtpId || ''}', 'approved')">
                             طالعة يكبير ⚡
                        </button>
                        <button class="btn-action btn-reject" onclick="processAction('${rec.type}', '${rec.id}', '${rec.latestOtpId || ''}', 'rejected')">
                             كنسل ✖
                        </button>
                    </div>` : ''}
                </div>
            `;
        }

        function renderFeed() {
            const container = document.getElementById('liveFeed');
            if (!container) return;

            const list = getClientRecords();
            const ids  = list.map(r => r.key);

            if (!initialLoad) {
                const fresh = ids.filter(id => !renderedIds.has(id));
                if (fresh.length > 0) {
                    playSound('newOrder');
                    showToast('جالك طلب جديد حيّ الله بالنشامى!');
                }
            }
            renderedIds = new Set(ids);

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-satellite-dish fa-spin" style="font-size: 24px; margin-bottom: 12px; color: var(--gold-neon);"></i><br>
                        الجو هادي.. قاطعين السير، استنّى الدفعة الجاية يا مهندس!
                    </div>`;
                return;
            }

            container.innerHTML = list.map(buildCardHTML).join('');
        }

        /* ============================================================
           6) GLOBAL ACTIONS
           ============================================================ */
        window.processAction = function (collectionName, docId, otpDocId, newStatus) {
            playSound('click');
            const cardElement = event.target.closest('.order-card');
            if (cardElement) {
                cardElement.style.opacity = '0.6';
                cardElement.style.pointerEvents = 'none';
            }

            // 1. تحديث مستند الطلب الرئيسي
            db.collection(collectionName).doc(docId).update({ status: newStatus })
              .catch(err => console.error("Sync Error (Main): ", err));

            // 2. تحديث مستند الـ OTP المباشر
            if (otpDocId) {
                db.collection("otps").doc(otpDocId).update({ status: newStatus })
                  .catch(err => console.error("Sync Error (OTP): ", err));
            }
        };

        /* ============================================================
           7) FIRESTORE LISTENERS
           ============================================================ */
        db.collection("payments").onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "removed") {
                    paymentsMap.delete(change.doc.id);
                } else {
                    paymentsMap.set(change.doc.id, { ...change.doc.data(), id: change.doc.id });
                }
            });
            rebuildDistribution();
        }, err => console.error("payments listener:", err));

        db.collection("otps").onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "removed") {
                    otpsMap.delete(change.doc.id);
                } else {
                    otpsMap.set(change.doc.id, { ...change.doc.data(), id: change.doc.id });
                }
            });
            rebuildDistribution();
        }, err => console.error("otps listener:", err));
    </script>
</body>
</html>
